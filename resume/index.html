<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Résumé · Anushree Kasturi</title>
<meta name="description" content="Résumé of Anushree Kasturi, CS undergrad at Amrita Bengaluru.">
<meta name="theme-color" content="#060908">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23070b0a'/><text x='50' y='66' font-family='monospace' font-size='46' font-weight='700' text-anchor='middle' fill='%23b9dfa5'>ak</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<!-- the visitor's theme from the main site, before first paint -->
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
  body { min-height: 100svh; }
  .bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: color-mix(in srgb, var(--ink) 82%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line); font: 12px var(--mono); }
  .bar a.back { color: var(--mute); }
  .bar a.back:hover { color: var(--sig); }
  .bar .title { font: 600 15px var(--head); color: var(--text); margin-left: 4px; }
  .bar .sp { flex: 1; }
  .bar .pages { color: var(--mute); }
  .tool { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--paper); color: var(--text); font: 12px var(--mono); cursor: pointer; transition: border-color .2s, color .2s; }
  .tool:hover { border-color: var(--sig); color: var(--sig); }
  .tool.primary { background: var(--sig); border-color: var(--sig); color: var(--on-sig); }
  .tool.primary:hover { filter: brightness(1.1); color: var(--on-sig); }
  .zoom { display: inline-flex; align-items: center; gap: 4px; }
  .zoom span { min-width: 44px; text-align: center; color: var(--mute); }
  .doc { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 28px 16px 64px; }
  .doc canvas { display: block; max-width: none; background: #fff; border-radius: 4px; box-shadow: 0 0 0 1px var(--line), 0 24px 60px -24px #000c; }
  .doc .msg { font: 13px var(--mono); color: var(--mute); padding: 60px 0; text-align: center; }
  .doc .msg a { color: var(--sig); }
  .doc iframe { width: min(860px, 100%); height: 85svh; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  @media (max-width: 640px) { .bar .title, .zoom { display: none; } }
</style>
</head>
<body>
  <header class="bar">
    <a class="back" href="../">← anushreekasturi</a>
    <span class="title">Résumé</span>
    <span class="sp"></span>
    <span class="pages" id="pages" aria-live="polite"></span>
    <span class="zoom">
      <button type="button" class="tool" id="out" aria-label="Zoom out">−</button>
      <span id="pct">100%</span>
      <button type="button" class="tool" id="in" aria-label="Zoom in">+</button>
    </span>
    <a class="tool primary" href="anushree_resume.pdf" download="Anushree_Kasturi_Resume.pdf">Download</a>
  </header>

  <main class="doc" id="doc" aria-label="Résumé">
    <p class="msg">loading résumé…</p>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" integrity="sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e" crossorigin="anonymous"></script>
<script>
// Draws each page of the PDF as a canvas, fitted to the window and sharp on any screen.
// If PDF.js can't load, the browser's own viewer is used instead.
const FILE = "anushree_resume.pdf";
const doc = document.getElementById("doc"), pagesEl = document.getElementById("pages"), pct = document.getElementById("pct");
let pdf = null, zoom = 1, timer = 0;

async function render() {
  const width = Math.min(860, doc.clientWidth - 32) * zoom, ratio = Math.min(devicePixelRatio || 1, 3);
  const canvases = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const base = page.getViewport({ scale: 1 }), view = page.getViewport({ scale: width / base.width * ratio });
    const c = document.createElement("canvas");
    c.width = view.width; c.height = view.height;
    c.style.width = view.width / ratio + "px"; c.style.height = view.height / ratio + "px";
    c.setAttribute("role", "img"); c.setAttribute("aria-label", `Page ${n} of the résumé`);
    await page.render({ canvasContext: c.getContext("2d"), viewport: view }).promise;
    canvases.push(c);
  }
  doc.replaceChildren(...canvases);
  pct.textContent = Math.round(zoom * 100) + "%";
}

const fallback = () => {
  doc.innerHTML = `<iframe src="${FILE}" title="Résumé"></iframe><p class="msg">can't see it? <a href="${FILE}" download>download the PDF</a></p>`;
};

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  pdfjsLib.getDocument(FILE).promise.then((d) => {
    pdf = d;
    pagesEl.textContent = `${d.numPages} page${d.numPages === 1 ? "" : "s"}`;
    return render();
  }).catch(fallback);
} else fallback();

const setZoom = (z) => { zoom = Math.min(2, Math.max(0.6, Math.round(z * 10) / 10)); if (pdf) render(); };
document.getElementById("in").addEventListener("click", () => setZoom(zoom + 0.1));
document.getElementById("out").addEventListener("click", () => setZoom(zoom - 0.1));
addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && (e.key === "=" || e.key === "+")) { e.preventDefault(); setZoom(zoom + 0.1); }
  if ((e.metaKey || e.ctrlKey) && e.key === "-") { e.preventDefault(); setZoom(zoom - 0.1); }
});
addEventListener("resize", () => { clearTimeout(timer); timer = setTimeout(() => pdf && render(), 150); });
</script>
</body>
</html>
